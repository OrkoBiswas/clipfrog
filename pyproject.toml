[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142", "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3", "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.43,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26", "redis>=6,<9", "celery[redis]>=5.5,<6",
  "boto3>=1.40,<2", "httpx>=0.28,<1", "pillow>=12.3,<13"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "mypy>=1.17", "types-redis", "boto3-stubs[s3]", "types-requests"]
media = ["faster-whisper>=1.2.1,<2", "av>=16,<19", "scenedetect>=0.7.1,<0.8", "mediapipe>=0.10,<0.11", "opencv-python-headless>=4.12,<5"]

[tool.setuptools.packages.find]
where = ["apps/api", "workers/media"]
include = ["clipforge_api*", "clipforge_worker*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "workers/media/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["apps/api/clipforge_api", "workers/media/clipforge_worker"]
